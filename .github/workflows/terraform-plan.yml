################################################################################
# terraform-plan.yml
# Triggered on every pull request that touches Terraform files.
#
# Steps:
#   1. terraform fmt      — style check (fails if formatting differs)
#   2. terraform validate — syntax and provider schema validation
#   3. tfsec              — static security scanning
#   4. terraform plan     — dry-run against AWS, output posted as PR comment
#   5. infracost          — cost diff posted as PR comment
#
# Runs for both dev and prod environments in parallel jobs.
# The plan output uses -out=tfplan so the apply workflow uses the exact
# same plan without re-running it.
################################################################################

name: "Terraform Plan"

on:
  pull_request:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform-plan.yml"

permissions:
  contents: read
  pull-requests: write   # Required to post plan comments on PRs
  id-token: write        # Required for OIDC authentication to AWS

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "eu-central-1"

jobs:
  # ── Format check ─────────────────────────────────────────────────────────────
  fmt:
    name: "Terraform Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Check formatting
        run: terraform fmt -check -recursive ./terraform
        # -recursive checks all .tf files in all subdirectories
        # Fails if any file differs from canonical format

  # ── Security scan ─────────────────────────────────────────────────────────────
  tfsec:
    name: "tfsec Security Scan"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run tfsec
        uses: aquasecurity/tfsec-action@v1.0.0
        with:
          working_directory: ./terraform
          soft_fail: false   # Fail the pipeline on HIGH/CRITICAL findings
          format: lovely

  # ── Plan + cost estimate ──────────────────────────────────────────────────────
  plan:
    name: "Plan (${{ matrix.env }})"
    runs-on: ubuntu-latest
    needs: [fmt, tfsec]

    strategy:
      fail-fast: false   # Run both envs in parallel; don't stop prod if dev fails
      matrix:
        env: [dev]        # Add prod here once the prod environment is built

    defaults:
      run:
        working-directory: terraform/environments/${{ matrix.env }}

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      # ── AWS authentication via OIDC (no long-lived credentials) ───────────────
      # GitHub OIDC eliminates the need to store AWS_ACCESS_KEY_ID in secrets.
      # The IAM role must have a trust policy allowing github.com/oidc as IdP,
      # with a condition matching the repository name.
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "github-actions-plan-${{ matrix.env }}"

      # ── Terraform init ────────────────────────────────────────────────────────
      - name: Terraform init
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=corestack/${{ matrix.env }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      # ── Validate ──────────────────────────────────────────────────────────────
      - name: Terraform validate
        run: terraform validate

      # ── Plan ──────────────────────────────────────────────────────────────────
      - name: Terraform plan
        id: plan
        run: |
          terraform plan \
            -input=false \
            -out=tfplan \
            -var="grafana_admin_password=${{ secrets.GRAFANA_ADMIN_PASSWORD }}" \
            -var="oidc_provider_url=${{ secrets.OIDC_PROVIDER_URL }}" \
            -var="domain_name=${{ secrets.DOMAIN_NAME }}" \
            -var="github_org=${{ github.repository_owner }}" \
            -var="alarm_email=${{ secrets.ALARM_EMAIL }}" \
            2>&1 | tee plan.txt
        continue-on-error: true  # Post the plan as a comment even if it fails

      # ── Post plan to PR ───────────────────────────────────────────────────────
      - name: Post plan comment
        uses: actions/github-script@v7
        env:
          PLAN: ${{ steps.plan.outputs.stdout }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('terraform/environments/${{ matrix.env }}/plan.txt', 'utf8');
            const maxLen = 65000;
            const truncated = plan.length > maxLen
              ? plan.substring(0, maxLen) + '\n\n... (truncated)'
              : plan;

            const output = `### Terraform Plan — \`${{ matrix.env }}\` 📋
            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${truncated}
            \`\`\`
            </details>

            *Triggered by @${{ github.actor }} on \`${{ github.event_name }}\`*
            *Plan status: \`${{ steps.plan.outcome }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output
            });

      # ── Upload plan artifact for apply workflow ───────────────────────────────
      - name: Upload plan artifact
        uses: actions/upload-artifact@v4
        with:
          name: tfplan-${{ matrix.env }}-${{ github.sha }}
          path: terraform/environments/${{ matrix.env }}/tfplan
          retention-days: 5   # Plan is only valid until the next apply

      # ── Fail if plan failed ───────────────────────────────────────────────────
      - name: Check plan status
        if: steps.plan.outcome == 'failure'
        run: exit 1

  # ── Cost estimate ─────────────────────────────────────────────────────────────
  infracost:
    name: "Infracost"
    runs-on: ubuntu-latest
    needs: [fmt]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Infracost
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}

      - name: Generate cost estimate
        run: |
          infracost breakdown \
            --path terraform/environments/dev \
            --format json \
            --out-file /tmp/infracost.json \
            --terraform-var-file terraform/environments/dev/terraform.tfvars \
            2>/dev/null || true

      - name: Post cost comment
        uses: infracost/actions/comment@v3
        with:
          path: /tmp/infracost.json
          behavior: update   # Update existing comment rather than creating a new one
