################################################################################
# terraform-destroy.yml
# Manual trigger only — never runs automatically.
#
# Protected by:
#   1. workflow_dispatch — must be triggered manually from the GitHub UI
#   2. GitHub Environment gate — requires reviewer approval before destroy runs
#   3. Explicit env name input — must type the environment name to confirm
#
# This workflow calls teardown.sh rather than running terraform destroy
# directly, so the ordered module destruction is consistent with local runs.
################################################################################

name: "Terraform Destroy"

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to destroy (dev / staging / prod)"
        required: true
        type: choice
        options: [dev, staging, prod]
      confirm:
        description: "Type the environment name again to confirm"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  TF_VERSION: "1.7.5"
  AWS_REGION: "eu-central-1"

jobs:
  validate_input:
    name: "Validate confirmation"
    runs-on: ubuntu-latest
    steps:
      - name: Check confirmation matches environment
        run: |
          if [[ "${{ github.event.inputs.confirm }}" != "${{ github.event.inputs.environment }}" ]]; then
            echo "ERROR: confirmation '${{ github.event.inputs.confirm }}' does not match environment '${{ github.event.inputs.environment }}'"
            exit 1
          fi
          echo "Confirmation valid — proceeding to approval gate"

  # ── Approval gate — required before any destroy runs ─────────────────────────
  approve:
    name: "Approve destroy (${{ github.event.inputs.environment }})"
    runs-on: ubuntu-latest
    needs: validate_input
    # Uses a dedicated "destroy" GitHub Environment with stricter reviewer list
    environment: "destroy-${{ github.event.inputs.environment }}"
    steps:
      - name: Approval granted
        run: echo "Destroy approved for ${{ github.event.inputs.environment }}"

  destroy:
    name: "Destroy (${{ github.event.inputs.environment }})"
    runs-on: ubuntu-latest
    needs: approve

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: "github-actions-destroy-${{ github.event.inputs.environment }}"

      - name: Terraform init
        working-directory: terraform/environments/${{ github.event.inputs.environment }}
        run: |
          terraform init \
            -input=false \
            -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
            -backend-config="key=corestack/${{ github.event.inputs.environment }}/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="dynamodb_table=${{ secrets.TF_LOCK_TABLE }}"

      - name: Run ordered teardown
        run: |
          chmod +x scripts/teardown.sh
          scripts/teardown.sh \
            --env "${{ github.event.inputs.environment }}" \
            --region "${{ env.AWS_REGION }}" \
            --force
        env:
          # Pass sensitive vars so teardown's terraform destroy calls can access them
          TF_VAR_grafana_admin_password: ${{ secrets.GRAFANA_ADMIN_PASSWORD }}
          TF_VAR_oidc_provider_url: ${{ secrets.OIDC_PROVIDER_URL }}
          TF_VAR_domain_name: ${{ secrets.DOMAIN_NAME }}
          TF_VAR_github_org: ${{ github.repository_owner }}
