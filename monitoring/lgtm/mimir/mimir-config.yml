################################################################################
# Mimir — local development configuration
#
# Single-binary mode (all components in one process) with filesystem storage.
# Mirrors the production mimir-distributed single-binary Helm deployment.
# Prometheus remote-writes here; Grafana queries here via the Mimir datasource.
#
# Mimir API endpoint: http://localhost:9009
# Prometheus-compatible query API: http://localhost:9009/prometheus
# Remote-write endpoint: http://localhost:9009/api/v1/push
################################################################################

# Use filesystem instead of S3 for local dev
multitenancy_enabled: false

server:
  http_listen_port: 9009
  grpc_listen_port: 9095
  log_level: warn

common:
  storage:
    backend: filesystem
    filesystem:
      dir: /data/mimir

blocks_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/blocks
  tsdb:
    dir: /data/mimir/tsdb
    retention_period: 2h      # Short — compactor moves blocks to object storage quickly

ingester:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
    replication_factor: 1

distributor:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory

store_gateway:
  sharding_ring:
    replication_factor: 1

compactor:
  data_dir: /data/mimir/compactor
  sharding_ring:
    kvstore:
      store: inmemory

ruler:
  enable_api: true
  rule_path: /data/mimir/rules

ruler_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/ruler

alertmanager:
  data_dir: /data/mimir/alertmanager
  enable_api: true
  fallback_config_file: ""

alertmanager_storage:
  backend: filesystem
  filesystem:
    dir: /data/mimir/alertmanager

limits:
  # Match production limits so queries behave identically
  ingestion_rate: 30000
  ingestion_burst_size: 50000
  max_global_series_per_user: 1500000
  max_fetched_chunks_per_query: 2000000
  # Retention — 30 days in local dev (production uses 365 for Mimir)
  compactor_blocks_retention_period: 720h
